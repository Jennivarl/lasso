[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
# Smallest code: Portaldot charges a storage deposit per byte of deployed code.
optimizer_runs = 1
via_ir = true

[rpc_endpoints]
portaldot = "https://test-evm-rpc-v3.portaldot.dev"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
